targets:
  clips_per_day: 10
  clip_length_sec: 60
  # 2 per video now that there are 8 sources; keeps the batch varied
  # instead of 5 clips from one stream.
  max_clips_per_source_video: 2
  min_gap_sec: 45          # keep clips from the same video apart
  min_score: 0.30          # skip a video that yields nothing above this
  max_videos_downloaded: 6 # hard cap on bandwidth per run

render:
  width: 1080              # vertical 9:16
  height: 1920
  fps: 30
  layout: blur_pad         # blur_pad | center_crop | fit
  blur_sigma: 28
  crf: 22
  preset: veryfast
  audio_lufs: -14

  burn_captions: true
  # mrbeast = one word at a time, zoom-in pop, keywords green with white stroke
  # classic = the old two-line caption block
  caption_style: mrbeast
  caption_font: "Komika Axis"         # personal use only -> ~/clipforge/fonts (not in git)
  caption_font_fallback: "Bangers"    # OFL, bundled in assets/fonts
  caption_font_dir: ""                # optional extra folder to search for fonts
  caption_size: 150
  caption_outline: 12
  caption_shadow: 6
  caption_margin_v: 560    # clears TikTok / Reels UI
  caption_uppercase: true
  caption_bold: true
  caption_words_per_card: 1           # 1 = one-word pops; try 2-3 for short cards
  caption_pop_ms: 90                  # how long the zoom-in takes
  caption_pop_scale: 118              # starts at 118% and settles at 100%
  keyword_color: "&H00FF00&"          # ASS is BGR - this is pure green
  keyword_outline: "&HFFFFFF&"        # white stroke around the green words
  max_chars_per_line: 20              # classic style only

analysis:
  use_youtube_subs: true   # free auto-captions, no whisper needed
  whisper_fallback: false  # enable only if a video has no captions
  whisper_model: "tiny"
  audio_energy: true
  weights:
    energy: 0.35           # loud = shouting / laughing / hype
    speech: 0.15           # enough talking to be watchable
    hooks: 0.30            # "no way", "bro what", "chat look"
    laughs: 0.20           # [Laughter] markers from auto-captions

output:
  dir: "output"
  keep_source_files: false
  write_platform_captions: true


