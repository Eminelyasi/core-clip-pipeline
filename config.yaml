    name: "CORE"
    rights_confirmed: true
    max_candidates: 2

  # 1.45M subs, 250-550k views/video
  - handle: "UCLldJScHWCtsFlfanYXS8nQ"
    name: "Stable Ronaldo"
    rights_confirmed: true
    max_candidates: 2

  # 1.26M subs, up to 1.1M views/video
  - handle: "UCxoKaKMzulp6sfQGOhNJnzQ"
    name: "JasonTheWeen"
    rights_confirmed: true
    max_candidates: 2

  # 1.64M subs, 58-153k views/video
  - handle: "UC7RNjS5nGShmMSuMcVgUyjQ"
    name: "Marlon"
    rights_confirmed: true
    max_candidates: 2

  # 975k subs, ~300k views/video
