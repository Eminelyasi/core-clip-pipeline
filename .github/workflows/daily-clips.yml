name: Daily clips

on:
  schedule:
    # 13:00 UTC = 09:00 New York (EDT). Adjust to your posting time.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discovery only (no downloads)"
        type: boolean
        default: false

concurrency:
  group: daily-clips
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
      YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Restore YouTube cookies
        if: env.YT_COOKIES_B64 != ''
        shell: bash
        run: |
          set -uo pipefail
          # A secret is single-line, but strip stray whitespace/quotes from manual pastes.
          printf '%s' "$YT_COOKIES_B64" | tr -d ' \t\r\n"' > /tmp/cookies.b64
          chars=$(wc -c < /tmp/cookies.b64)
          echo "secret payload: ${chars} characters"

          if grep -qE 'youtube\.com|Netscape' /tmp/cookies.b64; then
            echo "::error::YT_COOKIES_B64 contains the raw cookies.txt text, not base64."
            echo "Fix: run tools/make_cookies_secret.ps1 locally, then paste its clipboard value into the secret."
            exit 1
          fi

          if [ -n "$(tr -d 'A-Za-z0-9+/=' < /tmp/cookies.b64)" ]; then
            echo "::error::YT_COOKIES_B64 has characters that are not valid base64 (A-Z a-z 0-9 + / =)."
            echo "Fix: re-copy the value from tools/make_cookies_secret.ps1 and paste it whole."
            exit 1
          fi

          if ! base64 -d /tmp/cookies.b64 > cookies.txt 2> /tmp/b64.err; then
            echo "::error::YT_COOKIES_B64 is not decodable base64 (truncated or mangled paste)."
            echo "decoder: $(cat /tmp/b64.err)"
            exit 1
          fi

          bytes=$(wc -c < cookies.txt)
          if [ "$bytes" -lt 100 ]; then
            echo "::error::decoded cookies.txt is only ${bytes} bytes, so the paste was truncated."
            echo "Fix: re-run tools/make_cookies_secret.ps1 and paste the whole clipboard value."
            exit 1
          fi

          if ! grep -qi 'youtube\.com' cookies.txt; then
            echo "::error::decoded file has no youtube.com cookies."
            echo "Fix: export cookies from a signed-in youtube.com tab."
            exit 1
          fi

          echo "cookies.txt ready: ${bytes} bytes, $(grep -ci 'youtube\.com' cookies.txt) youtube.com rows"

      - name: Doctor
        run: python -m clipforge doctor

      - name: Build today's clips
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m clipforge run --dry-run
          else
            python -m clipforge run
          fi

      - name: Show output
        if: always()
        run: |
          ls -R output || true

      - name: Upload clips as artifact
        if: always() && inputs.dry_run != true
        uses: actions/upload-artifact@v7
        with:
          name: clips-${{ github.run_number }}
          path: output/
          # 3 days keeps storage small; the Release below is permanent.
          # On a private repo set this to 1 (500 MB free tier).
          retention-days: 3
          if-no-files-found: warn

      - name: Publish release (permanent download page)
        if: success() && inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: clips-${{ github.run_number }}
          name: "Clips ${{ github.run_number }}"
          body: |
            Auto-generated vertical clips. Download, then upload to TikTok / Shorts / Reels.
            Captions for each clip are in the `captions/` folder next to the videos.
          files: |
            output/**/clips/*.mp4
            output/**/captions/*.txt
            output/**/UPLOAD.txt
            output/**/manifest.json
          fail_on_unmatched_files: false
          make_latest: true

      - name: Persist dedupe state
        if: success()
        run: |
          if [ -n "$(git status --porcelain state/processed.json)" ]; then
            git config user.name  "clipforge-bot"
            git config user.email "clipforge-bot@users.noreply.github.com"
            git add state/processed.json
            git commit -m "chore: update clip state [skip ci]"
            git push
          fi
