name: Daily clips

# Runs on the self-hosted Windows runner so YouTube sees a residential IP.
# GitHub-hosted runners get "Sign in to confirm you're not a bot" on every download.

on:
  schedule:
    # 13:00 UTC = 09:00 New York (EDT). Adjust to your posting time.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discovery only (no downloads)"
        type: boolean
        default: false

concurrency:
  group: daily-clips
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clip:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240

    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}

    steps:
      # Must run before checkout: without git on PATH, actions/checkout falls back
      # to downloading a tarball, which leaves no .git and breaks the state commit.
      - name: Put git on PATH
        shell: powershell
        run: |
          if (Get-Command git -ErrorAction SilentlyContinue) {
            Write-Output "git already on PATH"
            exit 0
          }
          foreach ($candidate in @("C:\Program Files\Git\cmd", "C:\Program Files (x86)\Git\cmd")) {
            if (Test-Path (Join-Path $candidate "git.exe")) {
              $candidate | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              Write-Output "git dir added for this job: $candidate"
              exit 0
            }
          }
          Write-Error "git not found. Install Git for Windows and re-run."
          exit 1

      - uses: actions/checkout@v7

      - name: Locate ffmpeg and git
        shell: powershell
        run: |
          $dirs = @()
          $ff = Join-Path $env:USERPROFILE "clipforge\ffmpeg\bin"
          if (-not (Test-Path (Join-Path $ff "ffmpeg.exe"))) {
            $found = Get-Command ffmpeg -ErrorAction SilentlyContinue
            if ($found) {
              $ff = Split-Path $found.Source
            } else {
              Write-Error "ffmpeg not found. Run SETUP.md Plan B step 5 (winget install Gyan.FFmpeg)."
              exit 1
            }
          }
          $dirs += $ff

          if (-not (Get-Command git -ErrorAction SilentlyContinue)) {
            foreach ($candidate in @("C:\Program Files\Git\cmd", "C:\Program Files (x86)\Git\cmd")) {
              if (Test-Path (Join-Path $candidate "git.exe")) { $dirs += $candidate; break }
            }
          }
          foreach ($d in $dirs) { $d | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }

          & (Join-Path $ff "ffmpeg.exe") -version | Select-Object -First 1
          Write-Output "added to PATH: $($dirs -join '; ')"

      - name: Install Python deps
        shell: powershell
        run: |
          python -m pip install --upgrade pip --quiet
          python -m pip install -r requirements.txt --quiet
          python --version

      - name: Restore YouTube cookies
        if: env.YT_COOKIES_B64 != ''
        shell: powershell
        run: |
          $raw = $env:YT_COOKIES_B64
          $clean = ($raw -replace '[\s"'']', '')
          Write-Output "secret payload: $($clean.Length) characters"

          if ($clean -match 'youtube\.com|Netscape') {
            Write-Error "YT_COOKIES_B64 contains the raw cookies.txt text, not base64. Run tools/make_cookies_secret.ps1 and paste its clipboard value."
            exit 1
          }
          if ($clean -notmatch '^[A-Za-z0-9+/=]+$') {
            Write-Error "YT_COOKIES_B64 has characters that are not valid base64."
            exit 1
          }
          try {
            $bytes = [Convert]::FromBase64String($clean)
          } catch {
            Write-Error "YT_COOKIES_B64 is not decodable base64 (truncated or mangled paste)."
            exit 1
          }
          if ($bytes.Length -lt 100) {
            Write-Error "decoded cookies.txt is only $($bytes.Length) bytes, so the paste was truncated."
            exit 1
          }
          [IO.File]::WriteAllBytes((Join-Path $PWD "cookies.txt"), $bytes)
          $text = [Text.Encoding]::UTF8.GetString($bytes)
          $rows = ([regex]::Matches($text, 'youtube\.com')).Count
          if ($rows -eq 0) {
            Write-Error "decoded file has no youtube.com cookies. Export from a signed-in youtube.com tab."
            exit 1
          }
          Write-Output "cookies.txt ready: $($bytes.Length) bytes, $rows youtube.com rows"

      - name: Doctor
        shell: powershell
        run: python -m clipforge doctor

      - name: Build today's clips
        shell: powershell
        run: |
          if ("${{ inputs.dry_run }}" -eq "true") {
            python -m clipforge run --dry-run
          } else {
            python -m clipforge run
          }

      - name: Show output
        if: always()
        shell: powershell
        run: |
          if (Test-Path output) { Get-ChildItem -Recurse output | Select-Object FullName, Length } else { Write-Output "no output directory" }

      - name: Upload clips as artifact
        if: always() && inputs.dry_run != true
        uses: actions/upload-artifact@v7
        with:
          name: clips-${{ github.run_number }}
          path: output/
          # 3 days keeps storage small; the Release below is permanent.
          retention-days: 3
          if-no-files-found: warn

      - name: Publish release (permanent download page)
        if: success() && inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: clips-${{ github.run_number }}
          name: "Clips ${{ github.run_number }}"
          body: |
            Auto-generated vertical clips. Download, then upload to TikTok / Shorts / Reels.
            Captions for each clip are in the `captions/` folder next to the videos.
          files: |
            output/**/clips/*.mp4
            output/**/captions/*.txt
            output/**/UPLOAD.txt
            output/**/manifest.json
          fail_on_unmatched_files: false
          make_latest: true

      - name: Persist dedupe state
        if: success()
        shell: powershell
        run: |
          git config core.autocrlf false
          $status = git status --porcelain state/processed.json
          if ($status) {
            git config user.name  "clipforge-bot"
            git config user.email "clipforge-bot@users.noreply.github.com"
            git add state/processed.json
            git commit -m "chore: update clip state [skip ci]"
            # checkout can leave a detached HEAD, so push the commit explicitly.
            git push origin HEAD:main
          } else {
            Write-Output "state unchanged - nothing to commit"
          }
